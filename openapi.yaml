openapi: 3.0.3
info:
  title: Object Counter API
  version: 1.0.0
  description: Flask API for object counting and prediction runs.
servers:
  - url: http://127.0.0.1:5001
paths:
  /models:
    get:
      summary: List public model aliases
      responses:
        '200':
          description: Available models, including default_model, default_count_model, and default_prediction_model.
  /object-count:
    post:
      summary: Count detected objects above a threshold and update cumulative totals
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                threshold:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0.5
                model_name:
                  type: string
                  description: Public model alias. Defaults to default_count_model.
      responses:
        '200':
          description: Current and cumulative object counts
        '400':
          description: Invalid request or unknown model_name
        '502':
          description: Detector backend unavailable or returned invalid data
  /predictions:
    post:
      summary: Return filtered predictions and store a prediction run
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                threshold:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0.5
                model_name:
                  type: string
                  description: Public model alias. Defaults to default_prediction_model.
      responses:
        '200':
          description: Stored prediction run with filtered predictions
        '400':
          description: Invalid request or unknown model_name
        '502':
          description: Detector backend unavailable or returned invalid data
  /prediction-runs:
    get:
      summary: List stored prediction runs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 0, maximum: 50, default: 10 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Paginated prediction runs
        '400':
          description: Invalid limit or offset
  /prediction-runs/{prediction_run_id}:
    get:
      summary: Fetch a stored prediction run
      parameters:
        - name: prediction_run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Prediction run
        '404':
          description: Prediction run not found
  /debug-images/{filename}:
    get:
      summary: Fetch an annotated debug image
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: JPEG image
components:
  schemas:
    Prediction:
      type: object
      properties:
        class_name: { type: string }
        score: { type: number }
        box:
          type: object
          properties:
            xmin: { type: number }
            ymin: { type: number }
            xmax: { type: number }
            ymax: { type: number }
