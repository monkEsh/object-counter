services:
  app:
    build:
      context: .
    container_name: object-counter-app
    environment:
      ENV: prod
      TFS_HOST: tfserving
      TFS_PORT: "8501"
      MODEL_REGISTRY_PATH: /app/resources/model_registry.json
      DEFAULT_COUNT_MODEL: count-current
      DEFAULT_PREDICTION_MODEL: prediction-current
      DATABASE_URL: postgresql+psycopg2://object_counter:object_counter@postgres:5432/object_counter
      FLASK_DEBUG: ${FLASK_DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "5001:5001"
    volumes:
      - ./tmp/debug:/app/tmp/debug
      # Mount source so Werkzeug's reloader picks up changes without rebuilding.
      # Remove these mounts in production to use only the built image.
      - ./counter:/app/counter
      - ./resources:/app/resources
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg2://object_counter:object_counter@postgres:5432/object_counter
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

  test:
    build:
      context: .
    command: python -m pytest -q
    profiles:
      - test

  smoke:
    build:
      context: .
    command: >
      python scripts/smoke_test.py
      --base-url http://app:5001
      --image resources/images/boy.jpg
    depends_on:
      - app
    profiles:
      - smoke

  tfserving:
    # ARM64-compatible TensorFlow Serving image for Apple Silicon.
    # The official tensorflow/serving image is amd64-only and hangs/crashes on M-series Macs.
    image: emacski/tensorflow-serving:2.6.0-linux_arm64
    container_name: object-counter-tfserving
    ports:
      - "8500:8500"
      - "8501:8501"
    volumes:
      - ./tmp/model:/models:ro
    command: [ "--model_config_file=/models/model_config.config" ]
    healthcheck:
      # TF Serving REST API returns 200 on /v1/models/<name> when the model is loaded.
      # Uses wget (available in the base image) to avoid requiring curl.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8501/v1/models/rfcn || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
      - tfserving

  postgres:
    image: postgres:16
    container_name: object-counter-postgres
    environment:
      POSTGRES_USER: object_counter
      POSTGRES_PASSWORD: object_counter
      POSTGRES_DB: object_counter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U object_counter -d object_counter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
