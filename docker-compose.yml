services:
  app:
    build:
      context: .
    container_name: object-counter-app
    environment:
      ENV: prod
      TFS_HOST: tfserving
      TFS_PORT: "8501"
      MODEL_REGISTRY_PATH: /app/resources/model_registry.json
      DEFAULT_MODEL: current
      DATABASE_URL: postgresql+psycopg2://object_counter:object_counter@postgres:5432/object_counter
      FLASK_DEBUG: "false"
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      tfserving:
        condition: service_healthy

  tfserving:
    # ARM64-compatible TensorFlow Serving image for Apple Silicon.
    # The official tensorflow/serving image is amd64-only and hangs/crashes on M-series Macs.
    image: emacski/tensorflow-serving:2.6.0-linux_arm64
    container_name: object-counter-tfserving
    ports:
      - "8500:8500"
      - "8501:8501"
    volumes:
      - ./tmp/model:/models:ro
    command: [ "--model_config_file=/models/model_config.config" ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8501; printf \"GET /v1/models/rfcn HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"\\\"state\\\": *\\\"AVAILABLE\\\"\" <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: object-counter-postgres
    environment:
      POSTGRES_USER: object_counter
      POSTGRES_PASSWORD: object_counter
      POSTGRES_DB: object_counter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U object_counter -d object_counter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
