services:
  app:
    build:
      context: .
    container_name: object-counter-app
    environment:
      ENV: prod
      TFS_HOST: tfserving
      TFS_PORT: "8501"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: prod_counter
      FLASK_DEBUG: True
    ports:
      - "5001:5001"
    depends_on:
      mongo:
        condition: service_started
      tfserving:
        condition: service_started

  tfserving:
    # ARM64-compatible TensorFlow Serving image for Apple Silicon.
    # The official tensorflow/serving image is amd64-only and hangs/crashes on M-series Macs.
    image: emacski/tensorflow-serving:2.6.0-linux_arm64
    container_name: object-counter-tfserving
    ports:
      - "8500:8500"
      - "8501:8501"
    volumes:
      - ./tmp/model:/models:ro
    command: [ "--model_config_file=/models/model_config.config" ]

  mongo:
    image: mongo:6
    container_name: object-counter-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
